name: Daily RIR release
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-rir-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build merged data
        run: bash scripts/merge-rir.sh dist
      - name: Set UTC release date
        id: date
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Publish daily release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: rir-${{ steps.date.outputs.day }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating its assets"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "RIR snapshot ${{ steps.date.outputs.day }}" --notes "Daily merged APNIC, ARIN, LACNIC, AFRINIC and RIPE NCC delegated extended data. UTC snapshot date: ${{ steps.date.outputs.day }}."
          fi
